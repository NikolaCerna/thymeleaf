<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employees | Detail zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container page-container form-container">
    <div class="page-header">
        <div class="eyebrow">PERSONÁLNY SYSTÉM</div>
        <h1>Detail zamestnanca</h1>
        <p class="subtitle mb-0">Osobné a pracovné informácie na jednom mieste.</p>
    </div>

    <div class="content-card detail-card">
        <div class="person-header">
            <div class="person-avatar" th:text="${#strings.substring(employee.firstName, 0, 1) + #strings.substring(employee.lastName, 0, 1)}">JD</div>
            <div>
                <h2 class="person-name" th:text="${employee.firstName + ' ' + employee.lastName}">Jana Nováková</h2>
                <div class="subtitle" th:text="${employee.jobTitle}">Software Engineer</div>
            </div>
        </div>

        <div class="section-heading mt-4"><i class="far fa-user me-2"></i>Osobné údaje</div>
        <div class="row g-3 info-grid">
            <div class="col-md-6"><div class="info-label">Meno</div><div class="info-value" th:text="${employee.firstName}"></div></div>
            <div class="col-md-6"><div class="info-label">Priezvisko</div><div class="info-value" th:text="${employee.lastName}"></div></div>
            <div class="col-md-6"><div class="info-label">Dátum narodenia</div><div class="info-value" th:text="${employee.birthDate != null ? #dates.format(employee.birthDate, 'dd. MM. yyyy') : '—'}"></div></div>
            <div class="col-md-6"><div class="info-label">E-mail</div><div class="info-value" th:text="${employee.email}"></div></div>
            <div class="col-md-6"><div class="info-label">Telefón</div><div class="info-value" th:text="${employee.phone != null and !#strings.isEmpty(employee.phone) ? employee.phone : '—'}"></div></div>
        </div>

        <div class="section-heading mt-4"><i class="fas fa-briefcase me-2"></i>Pracovné údaje</div>
        <div class="row g-3 info-grid">
            <div class="col-md-6"><div class="info-label">Pracovná pozícia</div><div class="info-value" th:text="${employee.jobTitle}"></div></div>
            <div class="col-md-6"><div class="info-label">Typ úväzku</div><div class="info-value"><span class="type-badge" th:text="${employee.fullTime}"></span></div></div>
            <div class="col-md-6"><div class="info-label">Mesačný plat</div><div class="info-value" th:text="${employee.salary != null ? #numbers.formatInteger(employee.salary, 1, 'WHITESPACE') + ' €' : '—'}"></div></div>
        </div>
    </div>

    <div class="form-actions d-flex flex-wrap gap-2 justify-content-end">
        <a th:href="@{/employees}" class="btn btn-outline-secondary">Späť na zoznam</a>
        <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-primary"><i class="fas fa-pen me-2"></i>Upraviť</a>
        <form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post">
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('Naozaj chcete vymazať tohto zamestnanca?');">
                <i class="fas fa-trash me-2"></i>Vymazať
            </button>
        </form>
    </div>
</main>
</body>
</html>
