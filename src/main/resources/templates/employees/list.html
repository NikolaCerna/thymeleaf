<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employees | Zoznam zamestnancov</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container page-container">
    <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <div class="eyebrow">PERSONÁLNY SYSTÉM</div>
            <h1>Zamestnanci</h1>
            <p class="subtitle mb-0">Prehľad zamestnancov a správa pracovných údajov.</p>
        </div>
        <a th:href="@{/employees/create}" class="btn btn-primary btn-add">
            <i class="fas fa-plus me-2"></i>Pridať zamestnanca
        </a>
    </div>

    <div class="content-card table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>Meno</th>
                <th>Pracovná pozícia</th>
                <th>Typ úväzku</th>
                <th>Plat</th>
                <th class="text-end">Akcie</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5" class="text-center py-5 text-muted">Zatiaľ nemáte žiadnych zamestnancov.</td>
            </tr>
            <tr th:each="employee : ${employees}">
                <td>
                    <span class="employee-name" th:text="${employee.firstName + ' ' + employee.lastName}">Meno Priezvisko</span>
                    <span class="employee-email" th:text="${employee.email}">email@example.com</span>
                </td>
                <td th:text="${employee.jobTitle}">Software Engineer</td>
                <td><span class="type-badge" th:text="${employee.fullTime}">Full-time</span></td>
                <td th:text="${employee.salary != null ? #numbers.formatInteger(employee.salary, 1, 'WHITESPACE') + ' €' : '—'}">1 800 €</td>
                <td>
                    <div class="action-group justify-content-end">
                        <a th:href="@{/employees/{id}(id=${employee.id})}" class="btn btn-action btn-view" title="Zobraziť" aria-label="Zobraziť zamestnanca">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-action btn-edit" title="Upraviť" aria-label="Upraviť zamestnanca">
                            <i class="fas fa-pen"></i>
                        </a>
                        <form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-action btn-delete" title="Vymazať" aria-label="Vymazať zamestnanca"
                                    onclick="return confirm('Naozaj chcete vymazať tohto zamestnanca?');">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
