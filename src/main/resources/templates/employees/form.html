<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employees | Formulár zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container page-container form-container">
    <div class="page-header">
        <div class="eyebrow">PERSONÁLNY SYSTÉM</div>
        <h1 th:text="${employee.id} != null ? 'Upraviť zamestnanca' : 'Nový zamestnanec'">Nový zamestnanec</h1>
        <p class="subtitle mb-0">Vyplňte osobné a pracovné údaje zamestnanca.</p>
    </div>

    <form th:action="${employee.id} != null ? @{/employees/{id}(id=${employee.id})} : @{/employees}"
          th:object="${employee}" method="post">
        <div class="content-card form-card">
            <div class="section-heading"><i class="far fa-user me-2"></i>Osobné údaje</div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label" for="firstName">Meno</label>
                    <input type="text" class="form-control" id="firstName" th:field="*{firstName}" maxlength="50"
                           placeholder="Zadajte meno" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="lastName">Priezvisko</label>
                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}" maxlength="50"
                           placeholder="Zadajte priezvisko" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="birthDate">Dátum narodenia</label>
                    <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           placeholder="meno@firma.sk" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="phone">Telefón</label>
                    <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                           placeholder="+421 900 123 456">
                </div>
            </div>

            <div class="section-heading"><i class="fas fa-briefcase me-2"></i>Pracovné údaje</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="jobTitle">Pracovná pozícia</label>
                    <select class="form-select" id="jobTitle" th:field="*{jobTitle}" required>
                        <option value="">Vyberte pracovnú pozíciu</option>
                        <option th:each="title : ${jobTitles}" th:value="${title}" th:text="${title}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="salary">Mesačný plat (€)</label>
                    <input type="number" class="form-control" id="salary" th:field="*{salary}"
                           min="0" step="1" placeholder="Napr. 1800" required>
                </div>
                <div class="col-12">
                    <label class="form-label d-block">Typ úväzku</label>
                    <div class="employment-options">
                        <div class="form-check" th:each="type, stat : ${employmentTypes}">
                            <input class="form-check-input" type="radio" th:field="*{fullTime}"
                                   th:id="${'employment-' + stat.index}" th:value="${type}" required>
                            <label class="form-check-label" th:for="${'employment-' + stat.index}" th:text="${type}">Full-time</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-actions d-flex flex-wrap gap-2 justify-content-end">
            <a th:href="@{/employees}" class="btn btn-outline-secondary">Späť na zoznam</a>
            <button type="submit" class="btn btn-primary"
                    th:text="${employee.id} != null ? 'Uložiť zmeny' : 'Pridať zamestnanca'">Pridať zamestnanca</button>
        </div>
    </form>
</main>
</body>
</html>
